<script>
  function loadUrl(){
    const url=document.getElementById("urlInput").value;
    if(url.includes('https://') || url.includes('http://')){
      document.getElementById('contentFrame').src=url;
    }

    }

  }
</script>

<input type="text" id="commandInput" placeholder="输入命令">
<button onclick="executeCommand()">执行</button>
<button onclick="clearOutput()">清空历史</button>
<pre id="output" style="white-space:pre-wrap;"></pre>
<script>
  function executeCommand()
  {
    const command=document.getElementById('commandInput').value;
    const outputElement=document.getElementById('output');
    outputElement.textContent+="\n---command:${command}---\n";
    const eventSource=new EventSource('/execute?command=${encodeURIComponent(command)}');
    eventSource.onmessage=function(event){
      outputElement.textContent+=event.data;
    };
    eventSource.onerror=function(){
      eventSource.close();
    };
  }
  function clearOutput(){
    document.getElementById('output').textContent='';
  }
</script>
