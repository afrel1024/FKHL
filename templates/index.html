<!-- 搜索引擎功能 -->
<h3>搜索引擎</h3>
<input type="text" id="searchInput" placeholder="请输入搜索关键词" style="width: 400px;">
<button onclick="performSearch()">搜索</button>
<iframe id="searchFrame" src="" width="100%" height="400" 
        style="margin-top: 10px; border: 1px solid #ccc;" 
        sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

<br>

<input type="text" id="urlInput" placeholder="请输入url">
<input type="text" id="VIPpasswd" placeholder="请输入VIP口令">
<button onclick="loadUrl()" >加载</button>
<iframe id="targetFrame" src="https://fanyi.baidu.com" width="100%" 
        height="600" onload="resizeIframe()" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
<script>
  function loadUrl(){
    const url=document.getElementById("urlInput").value;
    const VIPpasswd=document.getElementById("VIPpasswd").value;
    if((url.includes('https://') || url.includes('http://')) && VIPpasswd=='admin'){
      document.getElementById('targetFrame').src='/proxy?url='+url;
    }
    else if(url.includes('https://') || url.includes('http://')){
      document.getElementById('targetFrame').src=url;
    }
    else{
      alert('sb');
    }

  }
  
  function performSearch() {
    const query = document.getElementById('searchInput').value;
    const searchFrame = document.getElementById('searchFrame');
    
    if (!query.trim()) {
      alert('请输入搜索关键词');
      return;
    }
    
    // 将搜索关键词传递给 iframe 页面
    searchFrame.src = '/search-results?query=' + encodeURIComponent(query);
  }
</script>

<input type="text" id="filenameInput" placeholder="example.txt">
<button id="submitBtn">加载txt</button>
<iframe id="txtFrame" src="" width="100%" height="400" 
        style="margin-top: 10px; border: 1px solid #ccc;" 
        sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
<script>
  const submitBtn = document.getElementById('submitBtn');
  const Input = document.getElementById('filenameInput');
  const Frame = document.getElementById('txtFrame');
  
  submitBtn.addEventListener('click', function() {
    const filename = Input.value.trim();
    if (filename) {
      Frame.src = `/txt?filename=${encodeURIComponent(filename)}`;
    }
    else{
      Frame.src = '';
    }
  });
</script>



<div id="authSection">
    <h3>身份验证 - 远程命令执行</h3>
    <input type="text" id="usernameInput" placeholder="请输入用户名">
    <input type="password" id="passwordInput" placeholder="请输入密码">
    <button onclick="authenticateAndExecute()">执行命令</button>
</div>
<div id="commandSection" style="display:none;">
    <h3>远程命令执行</h3>
    <input type="text" id="commandInput" placeholder="输入命令">
    <button onclick="executeCommand()">执行</button>
    <button onclick="clearOutput()">清空历史</button>
</div>
<pre id="output" style="white-space:pre-wrap;"></pre>
<script>
  let authUsername = '';
  let authPassword = '';
  
  function authenticateAndExecute() {
    authUsername = document.getElementById('usernameInput').value;
    authPassword = document.getElementById('passwordInput').value;
    
    if (!authUsername || !authPassword) {
      alert('请输入用户名和密码');
      return;
    }
    
    // 验证身份并显示命令执行区域
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('commandSection').style.display = 'block';
  }
  
  function executeCommand()
  {
    const command = document.getElementById('commandInput').value;
    const outputElement = document.getElementById('output');
    
    if (!command) {
      alert('请输入命令');
      return;
    }
    
    // 创建包含Basic Auth的EventSource
    outputElement.textContent += "\n---command:" + command + "---\n";
    
    // 使用XMLHttpRequest来支持Basic Auth
    const xhr = new XMLHttpRequest();
    const url = '/execute?command=' + encodeURIComponent(command);
    
    xhr.open('GET', url, true);
    xhr.setRequestHeader('Authorization', 'Basic ' + btoa(authUsername + ':' + authPassword));
    xhr.responseType = 'text';
    
    // 处理响应 - 逐行读取
    xhr.onprogress = function() {
      if (xhr.readyState >= 3 && xhr.responseText) {
        const receivedText = xhr.responseText;
        // 更新输出
        outputElement.textContent = receivedText;
        // 滚动到底部
        outputElement.scrollTop = outputElement.scrollHeight;
      }
    };
    
    xhr.onload = function() {
      if (xhr.status === 401) {
        alert('身份验证失败，请检查用户名和密码');
        // 显示验证界面
        document.getElementById('authSection').style.display = 'block';
        document.getElementById('commandSection').style.display = 'none';
      }
    };
    
    xhr.onerror = function() {
      outputElement.textContent += "\n[错误] 请求失败\n";
    };
    
    xhr.send();
  }
  
  function clearOutput() {
    document.getElementById('output').textContent = '';
  }
</script>
